<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <!-- BRIEF: Nova model-routing architecture. learner -> router (config.py) -> Lite(fast)/Pro(reasoning)/Micro(cheap) -> inference profile -> Bedrock. AWS palette. -->
  <rect width="900" height="540" fill="#ffffff"/>
  <text x="450" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#232F3E">Learning Assistant — Amazon Nova model routing (Converse API)</text>

  <!-- learner -->
  <rect x="40" y="240" width="110" height="60" rx="8" fill="#E8EDF3" stroke="#232F3E"/>
  <text x="95" y="266" text-anchor="middle" font-size="13" fill="#232F3E">Learner</text>
  <text x="95" y="284" text-anchor="middle" font-size="13" fill="#232F3E">request</text>

  <!-- router (diamond) -->
  <polygon points="305,225 390,270 305,315 220,270" fill="#FFF3D6" stroke="#B8860B"/>
  <text x="305" y="266" text-anchor="middle" font-size="12" font-weight="600" fill="#232F3E">model_id_for(task)</text>
  <text x="305" y="283" text-anchor="middle" font-size="11" fill="#232F3E">router · config.py</text>

  <!-- edge learner->router -->
  <line x1="150" y1="270" x2="220" y2="270" stroke="#232F3E" stroke-width="1.5"/>
  <polygon points="220,270 212,266 212,274" fill="#232F3E"/>

  <!-- Lite -->
  <rect x="470" y="118" width="300" height="84" rx="8" fill="#DDEFE0" stroke="#1D8102"/>
  <text x="482" y="140" font-size="13" font-weight="700" fill="#1D8102">Nova Lite — FAST (default)</text>
  <text x="482" y="158" font-size="11" fill="#232F3E" font-family="Consolas, monospace">amazon.nova-lite-v1:0</text>
  <text x="482" y="174" font-size="11" fill="#232F3E" font-family="Consolas, monospace">us.amazon.nova-lite-v1:0</text>
  <text x="482" y="192" font-size="11" fill="#687078">routing · short answers · agent turns</text>

  <!-- Pro -->
  <rect x="470" y="228" width="300" height="84" rx="8" fill="#D6E4F5" stroke="#1A4F8B"/>
  <text x="482" y="250" font-size="13" font-weight="700" fill="#1A4F8B">Nova Pro — REASONING</text>
  <text x="482" y="268" font-size="11" fill="#232F3E" font-family="Consolas, monospace">amazon.nova-pro-v1:0</text>
  <text x="482" y="284" font-size="11" fill="#232F3E" font-family="Consolas, monospace">us.amazon.nova-pro-v1:0</text>
  <text x="482" y="302" font-size="11" fill="#687078">tutoring · grading · multi-tool orchestration</text>

  <!-- Micro -->
  <rect x="470" y="338" width="300" height="84" rx="8" fill="#F3E6F5" stroke="#7A2E8A"/>
  <text x="482" y="360" font-size="13" font-weight="700" fill="#7A2E8A">Nova Micro — CHEAP (optional)</text>
  <text x="482" y="378" font-size="11" fill="#232F3E" font-family="Consolas, monospace">amazon.nova-micro-v1:0</text>
  <text x="482" y="394" font-size="11" fill="#232F3E" font-family="Consolas, monospace">us.amazon.nova-micro-v1:0</text>
  <text x="482" y="412" font-size="11" fill="#687078">ultra-cheap text classification</text>

  <!-- router -> models -->
  <path d="M390 260 L430 200 L470 160" fill="none" stroke="#1D8102" stroke-width="1.5"/>
  <polygon points="470,160 462,162 466,169" fill="#1D8102"/>
  <text x="398" y="196" font-size="10" fill="#1D8102">Task.FAST</text>

  <line x1="390" y1="270" x2="470" y2="270" stroke="#1A4F8B" stroke-width="1.5"/>
  <polygon points="470,270 462,266 462,274" fill="#1A4F8B"/>
  <text x="398" y="262" font-size="10" fill="#1A4F8B">Task.REASONING</text>

  <path d="M390 280 L430 340 L470 380" fill="none" stroke="#7A2E8A" stroke-width="1.5"/>
  <polygon points="470,380 466,371 462,378" fill="#7A2E8A"/>
  <text x="398" y="350" font-size="10" fill="#7A2E8A">Task.CHEAP</text>

  <!-- inference profile -->
  <rect x="470" y="450" width="300" height="40" rx="8" fill="#ffffff" stroke="#879196" stroke-dasharray="4 3"/>
  <text x="620" y="475" text-anchor="middle" font-size="11" fill="#232F3E">US cross-Region inference profile → Bedrock (us-east-1)</text>
  <line x1="620" y1="422" x2="620" y2="450" stroke="#879196" stroke-dasharray="4 3"/>
  <polygon points="620,450 616,442 624,442" fill="#879196"/>

  <text x="450" y="520" text-anchor="middle" font-size="11" font-style="italic" fill="#687078">No Anthropic / Claude models anywhere — guard-tested in config.</text>
</svg>
